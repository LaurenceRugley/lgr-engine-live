name: build-and-deploy
# Self-building public engine demo hub (LGR WebGL engine). Source is synced from the private lab
# (tools/deploy-live.sh); this repo builds ALL shipped public demos and deploys itself via the GitHub
# Actions Pages source. Public repo → Actions minutes are free-tier (not the lab's paid quota).
#   root  = the capability HUB (projects/live-hub)
#   /live/  = the city showcase   ·  /hoard/ = the Hoard game (+ /hoard/cavern.html)  ·  /office/ = office
# NOTE: a green build is NOT proof shaders compile (GPU compiles at runtime) — the lab's smoke gate covers
# that pre-push. This workflow packages + deploys. Spec: lgr-webgl-lab/docs/deploy-permanent-fix-2026-07-05.md.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual re-run — for build/artifact failures; NOT a lock-clear

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false   # never abort a mid-flight publish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # npm-workspaces monorepo: ci links engine-core + city/office/hoard. Build each public demo
      # (build:city/office/hoard are per-project scripts — they don't trigger the root prebuild, which
      # needs tools/ that isn't synced). live-hub is a static page (no build).
      - name: Install + build all public demos
        run: |
          npm ci
          npm run build:city
          npm run build:office
          npm run build:hoard
          npm run build:hoard2
          npm run build:metropolis
          npm run build:swing-lab
          npm run build:moto-lab
          npm run build:showcase-lab

      - name: Assemble site (hub at root · demos under stable paths)
        run: |
          rm -rf _site
          mkdir -p _site/live _site/hoard _site/hoard2 _site/office _site/metropolis _site/showcase-lab _site/swing-lab _site/moto-lab
          cp -R projects/city/dist/*   _site/live/
          cp -R projects/hoard/dist/*  _site/hoard/
          cp -R projects/hoard2/dist/* _site/hoard2/    # the one-shot Hoard v2 → /hoard2/ (base:'./')
          cp -R projects/office/dist/* _site/office/
          # metropolis + showcase-lab (added 2026-08-07). The hub has linked /metropolis/ for a while
          # and it returned 404 in production, because this list is hard-coded and nobody added it when
          # the card shipped. deploy-live.sh deliberately never syncs .github, so this file only changes
          # here — which is exactly how it drifted from the hub it serves.
          cp -R projects/metropolis/dist/*   _site/metropolis/
          # swing-lab (2026-08-09). THE THIRD OMISSION: a new project needs a build script, the
          # deploy SET, and THIS list. metropolis 404'd in production for exactly this reason,
          # and swing-lab 404'd too because the fix for the first two lives in a different repo.
          cp -R projects/swing-lab/dist/*    _site/swing-lab/
          cp -R projects/moto-lab/dist/*     _site/moto-lab/
          cp -R projects/showcase-lab/dist/* _site/showcase-lab/
          cp -R projects/live-hub/*    _site/          # the capability hub → site root
          touch _site/.nojekyll                        # keep _-prefixed Vite asset dirs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
