name: build-and-deploy
# Self-building public engine demo hub (LGR WebGL engine). Source is synced from the private lab
# (tools/deploy-live.sh); this repo builds ALL shipped public demos and deploys itself via the GitHub
# Actions Pages source. Public repo → Actions minutes are free-tier (not the lab's paid quota).
#   root  = the capability HUB (projects/live-hub)
#   /live/  = the city showcase   ·  /hoard/ = the Hoard game (+ /hoard/cavern.html)  ·  /office/ = office
# NOTE: a green build is NOT proof shaders compile (GPU compiles at runtime) — the lab's smoke gate covers
# that pre-push. This workflow packages + deploys. Spec: lgr-webgl-lab/docs/deploy-permanent-fix-2026-07-05.md.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual re-run — for build/artifact failures; NOT a lock-clear

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false   # never abort a mid-flight publish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # npm-workspaces monorepo: ci links engine-core + city/office/hoard. Build each public demo
      # (build:city/office/hoard are per-project scripts — they don't trigger the root prebuild, which
      # needs tools/ that isn't synced). live-hub is a static page (no build).
      - name: Install + build all public demos
        run: |
          npm ci
          npm run build:city
          npm run build:office
          npm run build:hoard

      - name: Assemble site (hub at root · demos under stable paths)
        run: |
          rm -rf _site
          mkdir -p _site/live _site/hoard _site/office
          cp -R projects/city/dist/*   _site/live/
          cp -R projects/hoard/dist/*  _site/hoard/
          cp -R projects/office/dist/* _site/office/
          cp -R projects/live-hub/*    _site/          # the capability hub → site root
          touch _site/.nojekyll                        # keep _-prefixed Vite asset dirs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
