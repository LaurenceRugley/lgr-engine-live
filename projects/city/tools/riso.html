<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LGR Riso — risograph print tool</title>
  <style>
    :root { --ink:#0e0b07; --gold:#b89968; }
    html,body { margin:0; height:100%; background:var(--ink); overflow:hidden;
      font:13px/1.5 ui-monospace, monospace; color:var(--gold); }
    #stage { position:fixed; inset:0; display:grid; place-items:center; }
    #stage canvas { max-width:96vw; max-height:96vh; box-shadow:0 10px 60px rgba(0,0,0,.6); }
    #hud { position:fixed; top:14px; left:14px; z-index:3; opacity:.7; letter-spacing:.08em; text-transform:uppercase; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud">LGR Riso — headless factory surface (__riso)</div>
  <script type="module" src="./riso.js"></script>
</body>
</html>
