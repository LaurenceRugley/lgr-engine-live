<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>The Hoard — survive the dead</title>
    <link rel="icon" href="data:," /><!-- suppress the implicit /favicon.ico request (keeps the zero-console-error gate honest) -->
    <style>
    /* Form controls do NOT inherit font-family: a <button> or <select> renders in the UA default
       (Arial here) next to a page set in something else, and it reads as a stray element rather than
       part of the design. Audited across every built project 2026-08-07 and found on six of them.
       One rule, and it cannot regress the canvas — this is DOM chrome only. */
    button, select, input, textarea { font: inherit; }
      :root { color-scheme: dark; }
      /* iOS Safari: lock the page (no pan/scroll that hid the map + stole look-drags in PORTRAIT) and use
         the DYNAMIC viewport height (dvh) so the canvas fills the VISIBLE area under the URL bar/toolbar.
         main.js also JS-fits to visualViewport + re-resizes on orientation/URL-bar changes (belt+braces). */
      /* The page had NO body font-family, so anything that did not set its own fell all the way
         back to the UA default — Times. That was not theoretical: no element happened to be affected, but the default was one un-fonted element away from it. Set the
         inherited default to the stack this project already uses everywhere else. */
      html, body { margin: 0; font-family: system-ui, sans-serif; height: 100dvh; background: #0e0b07; overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0; width: 100%; touch-action: none; }
      #app { position: fixed; inset: 0; height: 100dvh; touch-action: none; }
      canvas { display: block; touch-action: none; }
      /* Boot cover — hides the black first-paint until the world is dressed. Owned by the shell/ready. */
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 50;
        background: #0e0b07; color: #b9a582; font: 500 15px/1.5 system-ui, sans-serif;
        letter-spacing: 0.08em; text-transform: uppercase; transition: opacity 0.6s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">The Hoard — waking the dead…</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
